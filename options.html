<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إعدادات Learning Playlist Coach</title><link rel="stylesheet" href="options.css"></head><body><main><h1>إعدادات AI Coach</h1><p>أضف رابط وكيل الذكاء الاصطناعي الذي تريد فتحه عند الضغط على Ask AI Coach.</p><label>اسم الزر<input id="coachName" maxlength="40" placeholder="Ask AI Coach"></label><label>رابط الـ Agent<input id="agentUrl" type="url" dir="ltr" placeholder="https://..."></label><div id="validation"></div><div class="actions"><button id="save">حفظ الإعدادات</button><button id="test" class="secondary">اختبار فتح الرابط</button><button id="reset" class="secondary">استعادة الافتراضي</button></div><section><h2>شروط الرابط المقبول</h2><ul><li>يبدأ بـ HTTPS.</li><li>يكون عنوانًا كاملًا وصحيحًا.</li><li>لا يحتوي اسم مستخدم أو كلمة مرور داخل الرابط.</li><li>يمكن استخدام رابط Microsoft 365 Copilot Agent أو أي خدمة ويب موثوقة.</li></ul></section></main><script src="options.js"></script></body></html>
